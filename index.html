<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Apps</title>
  <meta name="description" content="A collection of simple standalone web apps.">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d1f23;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --card: #1b1e24;
        --text: #f1f3f5;
        --muted: #9aa3af;
        --accent: #60a5fa;
        --border: #2a2e36;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header, main, footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header { padding-top: 48px; padding-bottom: 24px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .tagline { margin: 0; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding-bottom: 48px;
    }
    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s, border-color .15s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card .icon { font-size: 1.75rem; }
    .card h2 { margin: 8px 0 4px; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); font-size: .95rem; }
    footer {
      padding-top: 16px;
      padding-bottom: 32px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <header>
    <!-- EDIT: site title and tagline -->
    <h1>My Apps</h1>
    <p class="tagline">A collection of simple standalone web apps.</p>
  </header>

  <main>
    <div class="grid">

      <!-- ===== APP CARDS =====
           Copy one <a class="card"> block per app.
           href = path to the app's HTML file in your repo. -->

      <a class="card" href="apps/sample-app.html">
        <div class="icon">🧮</div>
        <h2>Tip Calculator App</h2>
        <p>A simple tip calculator.</p>
      </a>

      <a class="card" href="apps/pyramid-shuttle-timer.html">
        <div class="icon">📋</div>
        <h2>Pyramid Shuttle Timer</h2>
        <p>This is the Pyramid Shuttle Timer App for Conditioning</p>
      </a>

    </div>
  </main>

  <footer>
    <!-- EDIT: your name -->
    &copy; <span id="year"></span> d ro
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
