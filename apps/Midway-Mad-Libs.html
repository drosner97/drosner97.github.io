<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Midway Mad Libs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: striped midway awning on top, one centered column (~680px) that swaps between story shelf, fill-in form, and the finished story */
:root {
  --bg: #F2F4FA;
  --card: #FFFFFF;
  --ink: #1E1B3A;
  --muted: #5E5A7D;
  --line: #D9DBEA;
  --red: #D7263D;
  --red-ink: #FFFFFF;
  --gold: #F2B33D;
  --gold-soft: #FCE7B8;
  --plum: #6B2FB3;
  --stripe-a: #D7263D;
  --stripe-b: #FFFFFF;
  --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15132A; --card: #221F3F; --ink: #F1EEFF; --muted: #ADA8D0; --line: #3A3661;
    --red: #FF5A6E; --red-ink: #1A0A10; --gold: #F5C15A; --gold-soft: #4A3A16; --plum: #B48CF5;
    --stripe-a: #C91F35; --stripe-b: #2C2850; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15132A; --card: #221F3F; --ink: #F1EEFF; --muted: #ADA8D0; --line: #3A3661;
  --red: #FF5A6E; --red-ink: #1A0A10; --gold: #F5C15A; --gold-soft: #4A3A16; --plum: #B48CF5;
  --stripe-a: #C91F35; --stripe-b: #2C2850; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
/* Night-sky banner: always dark by design, so its colors live in the SVG */
.awning { display: block; width: 100%; height: 96px; background: #0B0612; }
.shelf-group { display: grid; gap: 12px; }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--ink); }
.shelf-head span { font-family: var(--font-body); font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
header h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin: 0; color: var(--red); text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--plum); }

/* Story shelf: each story is an admission ticket */
.shelf { display: grid; gap: 28px; }
.ticket {
  display: grid; grid-template-columns: 1fr auto; gap: 0; text-align: left; width: 100%;
  background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; padding: 0; cursor: pointer; font: inherit;
  transition: transform .15s ease, box-shadow .15s ease;
}
.ticket:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
.ticket:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.ticket .main { padding: 18px 20px; display: grid; gap: 6px; min-width: 0; }
.ticket .main p { margin: 0; color: var(--muted); }
.ticket .stub { border-left: 2px dashed var(--ink); padding: 18px 20px; display: grid; place-items: center; font-family: var(--font-display); color: var(--red); text-align: center; line-height: 1.1; }
.ticket .stub small { display: block; font-family: var(--font-body); font-weight: 700; color: var(--muted); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.soon { color: var(--muted); font-size: .95rem; margin: 0; }

/* Panels */
.panel { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 22px; display: grid; gap: 18px; }
.panel-head { display: grid; gap: 4px; }
.panel-head p { margin: 0; color: var(--muted); }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; background: var(--plum); transition: width .2s ease; }
.progress-label { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
@media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-weight: 700; font-size: .95rem; }
.field label .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; margin-right: 4px; }
.field input {
  font: inherit; font-size: 1rem; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%; min-width: 0;
}
.field input:focus { outline: none; border-color: var(--plum); }
.field.missing input { border-color: var(--red); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-weight: 700; font-size: 1rem; padding: 11px 18px; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--ink); background: var(--card); color: var(--ink);
}
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--red-ink); font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.btn.link { border-color: transparent; background: none; color: var(--muted); padding-inline: 6px; text-decoration: underline; }
.error { color: var(--red); font-weight: 700; margin: 0; font-size: .95rem; }

/* Finished story */
.story h2 { color: var(--red); }
.story-text { display: grid; gap: 14px; font-size: 1.12rem; line-height: 1.7; max-width: 65ch; }
.story-text p { margin: 0; padding-left: 12px; border-left: 4px solid transparent; transition: border-color .2s ease; }
.story-text p.reading { border-left-color: var(--plum); }
.listen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.listen select { font: inherit; font-size: .9rem; padding: 9px 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); max-width: 100%; min-width: 0; }
.btn.speak { background: var(--plum); border-color: var(--plum); color: var(--card); }
.w {
  font-weight: 700; padding: 0 4px; border-radius: 4px;
  background: var(--gold-soft); box-shadow: inset 0 -3px 0 var(--gold);
  animation: pop .35s ease both;
}
@keyframes pop { from { background: var(--gold); } }
.keep { display: grid; gap: 10px; border-top: 2px dashed var(--line); padding-top: 16px; }
.toast { font-size: .9rem; color: var(--plum); font-weight: 700; margin: 0; min-height: 1.4em; }
@media (prefers-reduced-motion: reduce) { .ticket, .progress > span { transition: none; } .w { animation: none; } }
@media print {
  .awning, header, .actions, .keep, .listen, #view-shelf, #view-form { display: none !important; }
  body { background: #fff; color: #000; }
  .panel { border: none; padding: 0; }
  .w { background: none; box-shadow: none; text-decoration: underline; }
}
</style>

<main class="wrap">
  <header>
    <div class="eyebrow">Fill in the blanks · Read it out loud</div>
    <h1>Midway Mad Libs</h1>
    <p>Pick a story, fill in the words without peeking, then read your masterpiece.</p>
  </header>

  <section id="view-shelf" class="shelf" aria-label="Choose a story"></section>

  <section id="view-form" class="panel" hidden>
    <div class="panel-head">
      <div class="eyebrow" id="form-eyebrow"></div>
      <h2 id="form-title"></h2>
      <p>No peeking at the story. Just fill in each word.</p>
    </div>
    <div>
      <div class="progress"><span id="progress-bar"></span></div>
      <div class="progress-label" id="progress-label"></div>
    </div>
    <form id="word-form" novalidate>
      <div class="fields" id="fields"></div>
    </form>
    <p class="error" id="form-error" hidden></p>
    <div class="actions">
      <button class="btn primary" id="btn-make" type="button">Make My Mad Lib</button>
      <button class="btn" id="btn-random" type="button">Fill with random words</button>
      <button class="btn link" id="btn-back" type="button">Pick another story</button>
    </div>
  </section>

  <section id="view-story" class="panel story" hidden>
    <div class="panel-head">
      <div class="eyebrow">Your Mad Lib</div>
      <h2 id="story-title"></h2>
    </div>
    <div class="listen" id="listen" hidden>
      <button class="btn speak" id="btn-read" type="button">&#9654; Read it to me</button>
      <button class="btn" id="btn-stop" type="button" hidden>&#9632; Stop</button>
      <select id="voice" aria-label="Voice"></select>
    </div>
    <div class="story-text" id="story-text"></div>
    <div class="actions">
      <button class="btn primary" id="btn-again" type="button">Play again</button>
      <button class="btn" id="btn-edit" type="button">Change my words</button>
      <button class="btn link" id="btn-shelf" type="button">Pick another story</button>
    </div>
    <div class="keep">
      <div class="eyebrow">Keep it</div>
      <div class="actions">
        <button class="btn" id="btn-pdf" type="button">Save PDF</button>
        <button class="btn" id="btn-photo" type="button">Save photo</button>
        <button class="btn" id="btn-print" type="button">Print</button>
        <button class="btn" id="btn-copy" type="button">Copy text</button>
      </div>
      <p class="toast" id="toast" role="status"></p>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---- Word types: label, hint, and a word bank for "random" ---- */
const TYPES = {
  boyName:   { label: "Boy's name", hint: "e.g. Marcus", bank: ["Marcus","Leo","Jaxon","Ollie","Theo","Benny","Diego","Finn"] },
  kidName:   { label: "Kid's name", hint: "e.g. Riley", bank: ["Riley","Sam","Jordan","Max","Charlie","Frankie","Kai","Rosie"] },
  name:      { label: "Friend's name", hint: "Anyone you know", bank: ["Priya","Zeke","Maya","Tank","Lulu","Grandpa Joe","Coach Ray","Ava"] },
  relative:  { label: "Family member", hint: "e.g. Uncle Dave", bank: ["Uncle Dave","Grandma","Aunt Tina","Dad","Mom","Cousin Earl","Grandpa"] },
  adjective: { label: "Adjective", hint: "Describes a thing: sticky, huge", bank: ["sticky","gigantic","sparkly","grumpy","soggy","fancy","wobbly","stinky","majestic"] },
  food:      { label: "Food", hint: "Singular: pickle, taco", bank: ["pickle","taco","broccoli","meatball","cheese","jelly bean","sardine","waffle"] },
  pluralNoun:{ label: "Plural noun", hint: "More than one: socks", bank: ["socks","tubas","toenails","balloons","pencils","flip-flops","doorknobs"] },

  vegetable: { label: "Vegetable", hint: "e.g. zucchini", bank: ["zucchini","cucumber","pea","lettuce","celery stalk","lime-flavored pickle"] },

  verbIng:   { label: "Verb ending in -ing", hint: "e.g. dancing", bank: ["dancing","yodeling","snoring","juggling","moonwalking","sneezing"] },
  bodyPart:  { label: "Body part", hint: "e.g. elbow", bank: ["elbow","eyebrow","nostril","kneecap","earlobe","forehead"] },
  adverb:    { label: "Adverb", hint: "Ends in -ly: wildly", bank: ["wildly","sneakily","gracefully","angrily","clumsily","heroically"] },
  color:     { label: "Color", hint: "e.g. neon green", bank: ["neon green","hot pink","purple","polka-dot","plaid","glow-in-the-dark orange"] },
  noun:      { label: "Noun", hint: "A thing: toaster", bank: ["toaster","walrus","unicorn","banana","trombone","burrito"] },

/* ---- Stories: add more objects here. Text uses {key}; each key maps to a word type. ---- */
const COLLECTIONS = ["Halloween", "Everyday Adventures"];
const STORIES = [
  /* ===== Halloween ===== */

/* ---- State & helpers ---- */
const $ = id => document.getElementById(id);
let current = null;      // active story
let words = {};          // key -> word
const views = ["view-shelf", "view-form", "view-story"];
function show(view) { stopReading(); views.forEach(v => $(v).hidden = v !== view); window.scrollTo({ top: 0 }); }

/* ---- Read aloud (browser speech) ---- */
const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
let readState = "idle";   // idle | playing | paused
let voices = [];
function loadVoices() {
  if (!synth) return;
  const all = synth.getVoices();
  if (!all.length) return;
  const en = all.filter(v => /^en/i.test(v.lang));
  voices = en.length ? en : all;
  let saved = null; try { saved = localStorage.getItem("mml-voice"); } catch {}
  const sel = $("voice");
  sel.innerHTML = voices.map((v, i) => `<option value="${i}">${esc(v.name)}${v.default ? " (default)" : ""}</option>`).join("");
  const idx = voices.findIndex(v => v.name === saved);
  if (idx >= 0) sel.value = String(idx);
  $("listen").hidden = false;
}
function setReadUI() {
  $("btn-read").innerHTML = readState === "playing" ? "&#10074;&#10074; Pause" : readState === "paused" ? "&#9654; Resume" : "&#9654; Read it to me";
  $("btn-stop").hidden = readState === "idle";
}
function clearReadingMark() { document.querySelectorAll(".story-text p.reading").forEach(p => p.classList.remove("reading")); }
function stopReading() {
  if (!synth) return;
  synth.cancel(); readState = "idle"; clearReadingMark(); setReadUI();
}
function startReading() {
  synth.cancel();
  const voice = voices[Number($("voice").value)] || null;
  const parts = [current.title, ...current.paragraphs.map(p => p.replace(/\{(\w+)\}/g, (_, k) => words[k]))];
  const paras = [...$("story-text").querySelectorAll("p")];
  parts.forEach((text, i) => {
    const u = new SpeechSynthesisUtterance(text);   // one utterance per paragraph so long stories don't cut off
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.rate = 0.95;
    u.onstart = () => { clearReadingMark(); if (i > 0 && paras[i - 1]) paras[i - 1].classList.add("reading"); };
    if (i === parts.length - 1) u.onend = () => { readState = "idle"; clearReadingMark(); setReadUI(); };
    u.onerror = e => { if (e.error !== "interrupted" && e.error !== "canceled") { flash("Read-aloud stopped. Your browser may not allow speech here."); stopReading(); } };
    synth.speak(u);
  });
  readState = "playing"; setReadUI();
}
function toggleReading() {
  if (!synth) return;
  if (readState === "idle") startReading();
  else if (readState === "playing") { synth.pause(); readState = "paused"; setReadUI(); }
  else { synth.resume(); readState = "playing"; setReadUI(); }
}
if (synth) {
  loadVoices();
  synth.addEventListener ? synth.addEventListener("voiceschanged", loadVoices) : (synth.onvoiceschanged = loadVoices);
}
const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/* ---- Shelf ---- */
function renderShelf() {
  const shelf = $("view-shelf");

    if (!list.length) return "";

        <span class="stub">${Object.keys(s.blanks).length}<small>blanks</small></span>

/* ---- Form ---- */
function startStory(id, keepWords = false) {
  current = STORIES.find(s => s.id === id);
  if (!keepWords) words = {};
  $("form-eyebrow").textContent = `${Object.keys(current.blanks).length} words needed`;
  $("form-title").textContent = current.title;
  $("fields").innerHTML = Object.keys(current.blanks).map((key, i) => {
    const t = TYPES[current.blanks[key]];
    const fid = `w-${current.id}-${key}`;
    return `<div class="field" data-key="${key}">
      <label for="${fid}"><span class="n">${i + 1}.</span>${esc(t.label)}</label>
      <input id="${fid}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t.hint)}" value="${esc(words[key] || "")}">
    </div>`;
  }).join("");
  $("fields").querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => {
    inp.closest(".field").classList.remove("missing"); updateProgress();
  }));
  $("form-error").hidden = true;
  updateProgress();
  show("view-form");
  const first = $("fields").querySelector("input");
  if (first && !keepWords) first.focus({ preventScroll: true });
}
function readFields() {
  const out = {};
  $("fields").querySelectorAll(".field").forEach(f => out[f.dataset.key] = f.querySelector("input").value.trim());
  return out;
}
function updateProgress() {
  const vals = Object.values(readFields());
  const done = vals.filter(Boolean).length;
  $("progress-bar").style.width = `${(done / vals.length) * 100}%`;
  $("progress-label").textContent = `${done} of ${vals.length} filled`;
}
function fillRandom() {
  const used = new Set();
  $("fields").querySelectorAll(".field").forEach(f => {
    const inp = f.querySelector("input");
    if (inp.value.trim()) return;
    const bank = TYPES[current.blanks[f.dataset.key]].bank;
    let w = pick(bank), tries = 0;
    while (used.has(w) && tries++ < 10) w = pick(bank);
    used.add(w); inp.value = w; f.classList.remove("missing");
  });
  updateProgress();
}
function makeStory() {
  const vals = readFields();
  const missing = [...$("fields").querySelectorAll(".field")].filter(f => !vals[f.dataset.key]);
  missing.forEach(f => f.classList.add("missing"));
  if (missing.length) {
    $("form-error").textContent = `Fill in ${missing.length} more ${missing.length === 1 ? "word" : "words"}, or tap “Fill with random words” for the rest.`;
    $("form-error").hidden = false;
    missing[0].querySelector("input").focus();
    return;
  }
  words = vals;
  renderStory();
}

/* ---- Story ---- */
function renderStory() {
  $("story-title").textContent = current.title;
  $("story-text").innerHTML = current.paragraphs.map(p => {
    const html = esc(p).replace(/\{(\w+)\}/g, (_, k) => `<span class="w" title="${esc(TYPES[current.blanks[k]].label)}">${esc(words[k] || "___")}</span>`);
    return `<p>${html}</p>`;
  }).join("");
  flash("");
  show("view-story");
}
function storyPlainText() {
  return current.title + "\n\n" + current.paragraphs.map(p => p.replace(/\{(\w+)\}/g, (_, k) => words[k])).join("\n\n");
}
function flash(msg) { $("toast").textContent = msg; }

/* ---- Text layout shared by PDF and photo ---- */
function storyRuns(p) {
  const out = []; let last = 0;
  p.replace(/\{(\w+)\}/g, (m, k, i) => {
    if (i > last) out.push({ t: p.slice(last, i), b: false });
    out.push({ t: words[k], b: true });
    last = i + m.length; return m;
  });
  if (last < p.length) out.push({ t: p.slice(last), b: false });
  return out;
}
// Groups touching pieces into words (so "pickle," never splits), then wraps greedily.
function wrapRuns(runs, maxW, measure) {
  const groups = []; let cur = [];
  runs.forEach(r => r.t.split(/(\s+)/).forEach(part => {
    if (!part) return;
    if (/^\s+$/.test(part)) { if (cur.length) { groups.push(cur); cur = []; } }
    else cur.push({ t: part, b: r.b });
  }));
  if (cur.length) groups.push(cur);
  const space = measure(" ", false);
  const lines = []; let line = [], w = 0;
  groups.forEach(g => {
    const gw = g.reduce((s, x) => s + measure(x.t, x.b), 0);
    if (line.length && w + space + gw > maxW) { lines.push(line); line = []; w = 0; }
    if (line.length) w += space;
    line.push(g); w += gw;
  });
  if (line.length) lines.push(line);
  return lines;
}

/* ---- Saving files ---- */
let dlPromise = null;
function getDownloads() {
  if (!dlPromise) dlPromise = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
async function saveFile(name, blob) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === "declined") flash("Save canceled.");
      else if (code === "rate_limited") flash("A save prompt is already open. Finish that one first.");
      else flash("Saving files isn’t available in this view.");
      return false;
    }
  }
  if (window.claude) { flash("Saving files isn’t available in this view."); return false; }
  // Standalone page (e.g. hosted on your own site): plain browser download
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { flash("Something went wrong making that file. Try again."); }
  finally { btn.disabled = false; }
}

function buildPdf() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const W = 612, H = 792, M = 66, maxW = W - 2 * M;
  const RED = [215, 38, 61], INK = [30, 27, 58], TEAL = [107, 47, 179], GOLD = [252, 231, 184], MUTED = [94, 90, 125];
  const stripes = () => {   // night-sky band: black into purple, with a moon
    const bands = [[11, 6, 18], [26, 10, 44], [42, 15, 74], [64, 26, 110], [91, 36, 153]];
    bands.forEach((c, i) => { doc.setFillColor(...c); doc.rect(0, i * 5, W, 5.2, "F"); });
    doc.setFillColor(241, 232, 255); doc.circle(W - 90, 12, 7, "F");
  };
  stripes();
  let y = M + 16;
  doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...TEAL);
  doc.text("MIDWAY MAD LIBS", M, y); y += 30;
  doc.setFontSize(26); doc.setTextColor(...RED);
  const tl = doc.splitTextToSize(current.title, maxW); doc.text(tl, M, y); y += tl.length * 30 + 10;
  const size = 13.5, lh = 22;
  const measure = (t, b) => { doc.setFont("helvetica", b ? "bold" : "normal"); doc.setFontSize(size); return doc.getTextWidth(t); };
  current.paragraphs.forEach(p => {
    wrapRuns(storyRuns(p), maxW, measure).forEach(line => {
      if (y > H - M) { doc.addPage(); stripes(); y = M + 10; }
      let x = M;
      line.forEach((g, gi) => {
        if (gi) x += measure(" ", false);
        g.forEach(pc => {
          const w = measure(pc.t, pc.b);
          if (pc.b) { doc.setFillColor(...GOLD); doc.rect(x - 1.5, y - size + 1.5, w + 3, size + 4, "F"); }
          doc.setTextColor(...INK); doc.setFont("helvetica", pc.b ? "bold" : "normal"); doc.setFontSize(size);
          doc.text(pc.t, x, y); x += w;
        });
      });
      y += lh;
    });
    y += 12;
  });
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...MUTED);
  doc.text("Made with Midway Mad Libs", M, H - 34);
  return doc.output("blob");
}
async function savePdf(forPrint) {
  if (!window.jspdf) { flash("The PDF maker didn’t load. Check your connection and reload the page."); return; }
  const ok = await saveFile(`${slug(current.title)}-mad-lib.pdf`, buildPdf());
  if (ok) flash(forPrint ? "PDF saved. Open it and print from there." : "PDF saved.");
}

async function buildPhoto() {
  try { await Promise.all(["56px Bungee", "700 30px 'Atkinson Hyperlegible'", "400 30px 'Atkinson Hyperlegible'"].map(f => document.fonts.load(f))); } catch {}
  const W = 1200, CARD = 50, M = 110, maxW = W - 2 * M, size = 31, lh = 52;
  const body = "'Atkinson Hyperlegible', 'Segoe UI', sans-serif";
  const titleFont = "56px Bungee, Impact, sans-serif";
  const c = document.createElement("canvas"), ctx = c.getContext("2d");
  const measure = (t, b) => { ctx.font = `${b ? 700 : 400} ${size}px ${body}`; return ctx.measureText(t).width; };
  const titleLines = wrapRuns([{ t: current.title, b: false }], maxW, t => { ctx.font = titleFont; return ctx.measureText(t).width; });
  const paras = current.paragraphs.map(p => wrapRuns(storyRuns(p), maxW, measure));
  const top = 110;
  const textStart = top + 70 + 40 + titleLines.length * 68 + 20;
  const textH = paras.reduce((s, l) => s + l.length * lh + 26, 0);
  const cardBottom = textStart + textH + 70;
  c.width = W; c.height = cardBottom + 50;

  ctx.fillStyle = "#F2F4FA"; ctx.fillRect(0, 0, W, c.height);
  const sky = ctx.createLinearGradient(0, 0, 0, 80);     // night-sky band
  sky.addColorStop(0, "#0B0612"); sky.addColorStop(.55, "#2A0F4A"); sky.addColorStop(1, "#5B2499");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 80);
  ctx.fillStyle = "#F1E8FF"; ctx.beginPath(); ctx.arc(W - 170, 36, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#07030C"; ctx.beginPath(); ctx.moveTo(0, 80); ctx.lineTo(0, 66);
  ctx.quadraticCurveTo(300, 50, 600, 64); ctx.quadraticCurveTo(900, 76, 1200, 60); ctx.lineTo(1200, 80); ctx.fill();
  ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#1E1B3A"; ctx.lineWidth = 4;   // card
  ctx.beginPath(); ctx.roundRect(CARD, top, W - 2 * CARD, cardBottom - top, 22); ctx.fill(); ctx.stroke();

  let y = top + 70;
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#6B2FB3"; ctx.font = `700 22px ${body}`; ctx.fillText("MIDWAY MAD LIBS", M, y);
  y += 40 + 52;
  ctx.fillStyle = "#D7263D"; ctx.font = titleFont;
  titleLines.forEach(line => { ctx.fillText(line.map(g => g.map(p => p.t).join("")).join(" "), M, y); y += 68; });
  y = textStart + size;
  paras.forEach(lines => {
    lines.forEach(line => {
      let x = M;
      line.forEach((g, gi) => {
        if (gi) x += measure(" ", false);
        g.forEach(pc => {
          const w = measure(pc.t, pc.b);
          if (pc.b) {
            ctx.fillStyle = "#FCE7B8"; ctx.fillRect(x - 3, y - size + 2, w + 6, size + 8);
            ctx.fillStyle = "#F2B33D"; ctx.fillRect(x - 3, y + 6, w + 6, 4);
          }
          ctx.fillStyle = "#1E1B3A"; ctx.font = `${pc.b ? 700 : 400} ${size}px ${body}`;
          ctx.fillText(pc.t, x, y); x += w;
        });
      });
      y += lh;
    });
    y += 26;
  });
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("no image")), "image/png"));
}
async function savePhoto() {
  const ok = await saveFile(`${slug(current.title)}-mad-lib.png`, await buildPhoto());
  if (ok) flash("Photo saved.");
}

function printStory() {
  if (window.self === window.top) { window.print(); return; }
  // Inside Claude the print dialog is blocked, so print goes through the PDF.
  return savePdf(true);
}

async function copyStory() {
  try { await navigator.clipboard.writeText(storyPlainText()); flash("Story copied."); }
  catch {
    const r = document.createRange(); r.selectNodeContents($("story-text"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    flash("Story selected. Press Ctrl+C or ⌘C to copy.");
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("view-form").hidden && e.target.tagName === "INPUT") {
    const inputs = [...$("fields").querySelectorAll("input")];
    const i = inputs.indexOf(e.target);
    e.preventDefault();
    if (i < inputs.length - 1) inputs[i + 1].focus(); else makeStory();
  }
});

show("view-shelf");
